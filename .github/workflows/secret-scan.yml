name: Secret Scan

# 커밋된 시크릿을 잡는 마지막 방어선.
# 1차 방어선은 로컬 훅(.githooks/pre-commit)이고, 훅은 --no-verify 로 우회되므로
# 여기서 다시 본다. 규칙은 .gitleaks.toml 하나를 훅과 같이 쓴다.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 히스토리 전체를 봐야 과거 커밋에 섞여 들어간 값도 잡힌다.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # 조직(Organization) 소유 저장소에서 gitleaks-action v2 는 라이선스를 요구한다.
          # 이 저장소는 Korea-art-platform 조직 소속이므로 아래 시크릿 등록이 필요하다.
          # https://gitleaks.io/products.html 에서 발급받아 저장소 시크릿에 넣는다.
          #
          # 라이선스를 쓰지 않으려면 위 'Run gitleaks' 스텝을 지우고 아래로 바꾼다
          # (바이너리를 직접 내려받아 실행 — 라이선스 불필요):
          #
          #   - name: Run gitleaks
          #     run: |
          #       set -euo pipefail
          #       VER=8.28.0
          #       SHA256=<릴리스 페이지의 checksums.txt 에서 복사>
          #       curl -sSLo gitleaks.tar.gz \
          #         "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          #       echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          #       tar -xzf gitleaks.tar.gz gitleaks
          #       ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
