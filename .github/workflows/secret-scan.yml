name: Secret Scan

# 커밋된 시크릿을 잡는 마지막 방어선.
# 1차 방어선은 로컬 훅(.githooks/pre-commit)이고, 훅은 --no-verify 로 우회되므로
# 여기서 다시 본다. 규칙은 .gitleaks.toml 하나를 훅과 같이 쓴다.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 현재 파일만 본다. 과거 커밋은 이미 점검을 마쳤고, 새로 들어오는 값을 막는 게 목적이다.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run gitleaks
        # gitleaks-action 은 조직 저장소에서 유료 라이선스를 요구한다.
        # 공식 릴리스 바이너리를 sha256 으로 검증해 직접 돌린다 — 라이선스 불필요.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          workdir="$(pwd)"
          cd "$RUNNER_TEMP"
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          ./gitleaks version
          cd "$workdir"
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --redact --exit-code 1
