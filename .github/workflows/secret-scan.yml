name: Secret Scan

# 커밋된 시크릿을 잡는 마지막 방어선.
# 1차 방어선은 커밋 훅(.githooks/pre-commit)이고, 훅은 --no-verify 로 우회되므로
# 여기서 다시 본다. 훅과 CI 가 .githooks/scan-secrets.sh 하나를 같이 쓴다.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 현재 파일만 본다. 과거 커밋은 이미 점검을 마쳤고, 새로 들어오는 값을 막는 게 목적이다.
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Run secret scan
        run: sh .githooks/scan-secrets.sh --tracked
