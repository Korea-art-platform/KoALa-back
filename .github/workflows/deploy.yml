name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 21 세팅 ─────────────────────────────────────────────────────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Gradle 캐시 ──────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 4. 빌드 (테스트 스킵) ────────────────────────────────────────────────
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # ── 5. EC2 로 jar 전송 ──────────────────────────────────────────────────
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/arsoback-0.0.1-SNAPSHOT.jar"
          target: "/opt/koala"
          strip_components: 2

      # ── 6. systemd 재시작 ───────────────────────────────────────────────────
      - name: Restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -u

            # ── 직전 jar 를 보관한다 ────────────────────────────────────────
            # 이게 없으면 새 jar 가 기동에 실패했을 때 되돌릴 것이 없다.
            # 실제로 마이그레이션 하나가 깨져 서비스가 몇 시간 내려간 적이 있다.
            if [ -f /opt/koala/koalaback.jar ]; then
              cp -f /opt/koala/koalaback.jar /opt/koala/koalaback.jar.prev
            fi

            mv /opt/koala/arsoback-0.0.1-SNAPSHOT.jar /opt/koala/koalaback.jar

            # ── 기동 확인 ──────────────────────────────────────────────────
            # 재시작 루프가 돌면 판정이 흔들리므로 stop 후 start 한다.
            sudo systemctl stop koala || true
            sudo systemctl start koala

            for i in $(seq 1 24); do
              sleep 5
              if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Waiting... ($i/24)"
            done

            # ── 여기부터는 새 버전이 뜨지 못한 상황 ────────────────────────
            echo "::error::기동 실패 — 이전 버전으로 되돌립니다"
            sudo journalctl -u koala -n 60 --no-pager || true

            if [ ! -f /opt/koala/koalaback.jar.prev ]; then
              echo "이전 jar 가 없어 롤백할 수 없습니다 (최초 배포로 보임)"
              sudo systemctl stop koala || true
              exit 1
            fi

            # 재시작 루프를 먼저 끊는다. 살아 있는 채로 두면 깨진 버전이
            # 계속 올라오면서 마이그레이션 실패 기록을 다시 만든다.
            sudo systemctl stop koala || true

            # 실패한 마이그레이션 기록을 지운다. 남겨 두면 이전 버전마저 기동하지 못한다.
            # 스키마는 건드리지 않는다 — '실패했다'는 기록 행만 지운다.
            sudo docker exec koala-mysql sh -c \
              'mysql -uroot -p$MYSQL_ROOT_PASSWORD koala -e "DELETE FROM flyway_schema_history WHERE success = 0;"' \
              2>/dev/null || echo "마이그레이션 기록 정리 생략(해당 없음)"

            cp -f /opt/koala/koalaback.jar.prev /opt/koala/koalaback.jar
            sudo systemctl start koala

            for i in $(seq 1 24); do
              sleep 5
              if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
                echo "::error::롤백 완료 — 서비스는 이전 버전으로 복구되었습니다. 이번 변경은 반영되지 않았습니다."
                exit 1
              fi
              echo "Rollback waiting... ($i/24)"
            done

            echo "::error::롤백도 실패 — 수동 확인이 필요합니다"
            sudo journalctl -u koala -n 60 --no-pager || true
            exit 1

      # ── 7. 실패했을 때만 슬랙으로 알린다 ────────────────────────────────────
      # 성공은 알리지 않는다. 애플리케이션이 기동하면서 스스로 기동 알림을 보내므로
      # 여기서 또 보내면 배포 한 번에 알림이 두 개 올라온다.
      #
      # 워크플로가 여기까지 온 경우는 셋 중 하나다 — 빌드 실패, 전송 실패,
      # 그리고 기동 실패(롤백에 성공했더라도 이 워크플로는 실패로 끝난다).
      # 어느 쪽이든 사람이 봐야 한다.
      - name: Notify deploy failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # 시크릿이 등록돼 있지 않으면 조용히 넘어간다.
          # 알림을 못 보내는 것 때문에 배포 로그에 또 다른 실패를 남길 이유가 없다.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "SLACK_WEBHOOK_URL 시크릿이 없어 알림을 생략합니다"
            exit 0
          fi

          TEXT="🚨 *배포 실패* \`${GITHUB_REF_NAME}\`
          커밋 \`${GITHUB_SHA:0:7}\` · ${GITHUB_ACTOR}
          <${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|실행 로그 보기>
          _기동 실패였다면 이전 버전으로 롤백돼 서비스는 살아 있습니다._"

          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$TEXT" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL" > /dev/null || echo "슬랙 알림 발송 실패"
