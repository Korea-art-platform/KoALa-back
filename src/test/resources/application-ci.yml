# CI 전용 테스트 설정 — 실제 값은 하나도 들어 있지 않다.
#
# 운영/로컬 설정(src/main/resources/application*.yml, src/test/resources/application.yml)은
# 실제 시크릿을 담고 있어 .gitignore 로 커밋에서 제외돼 있다. 그 결과 GitHub Actions 의
# 새 체크아웃에는 스프링 설정이 하나도 없어 @SpringBootTest 가 기동하지 못했다.
# (jwt.secret 등 기본값 없는 @Value 7개가 풀리지 않아 컨텍스트 로드 실패)
#
# 그래서 CI 에서만 쓰는 더미 프로파일을 둔다. 워크플로가 SPRING_PROFILES_ACTIVE=ci 로
# 테스트를 돌린다. DB/Redis 접속 정보는 IntegrationTestSupport 의
# @DynamicPropertySource 가 Testcontainers 값으로 덮어쓰므로 여기에 두지 않는다.
#
# 여기에 진짜 값을 넣지 마세요. 전부 자리표시자여야 합니다.
spring:
  application:
    name: koalaback

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    validate-on-migrate: false

  mail:
    host: 127.0.0.1
    port: 1
    properties:
      mail:
        smtp:
          connectiontimeout: 300
          timeout: 300

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ci-dummy-kakao-client-id
            client-secret: ci-dummy-kakao-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - profile_nickname
              - account_email
          naver:
            client-id: ci-dummy-naver-client-id
            client-secret: ci-dummy-naver-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            client-name: Naver
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ci-dummy-jwt-signing-key-not-a-real-secret-do-not-use-in-production-0000
  access-token-expiry-ms: 1800000
  refresh-token-expiry-ms: 1209600000

cloud:
  aws:
    region:
      static: ap-northeast-2
    s3:
      bucket: ci-dummy-bucket

toss:
  secret-key: ci-dummy-toss-secret-key

koala:
  cdn-base-url: https://ci-dummy-cdn.invalid
