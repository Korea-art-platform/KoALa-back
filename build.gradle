plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.koala.koalaback'
version = '0.0.1-SNAPSHOT'
description = 'koalaback'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// build-info.properties 를 만들어 BuildProperties 빈이 뜨게 한다.
// 기동 알림에 빌드 시각을 실어 "지금 떠 있는 게 방금 배포한 그것인지"를 구분하려는 것 —
// 롤백되면 빌드 시각이 과거로 돌아간다.
springBoot {
    buildInfo()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1'
        mavenBom 'org.testcontainers:testcontainers-bom:1.20.4'
    }
}

dependencies {

    // ─── EMAIL ───
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // ── Spring Boot Core ──────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── Security ──────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // ── DB ────────────────────────────────────────────────
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    // Spring Boot 4.x: flyway-core 자동설정(FlywayAutoConfiguration)이 JPA와 순환 의존성을
    // 일으켜, 자동설정을 쓰지 않고 FlywayConfig 에서 직접 Flyway 빈을 등록한다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // ── Redis ─────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ── Kafka ─────────────────────────────────────────────
    // 주문 후처리(메일 등)를 이벤트로 분리. 브로커가 없는 환경에서는
    // koala.events.kafka.enabled=false 로 두면 리스너/프로듀서가 뜨지 않는다.
    implementation 'org.springframework.kafka:spring-kafka'

    // ── JWT ───────────────────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.5'

    // ── AWS S3 ────────────────────────────────────────────
    implementation 'io.awspring.cloud:spring-cloud-aws-s3'

    // ── QueryDSL ──────────────────────────────────────────
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // ── Lombok ────────────────────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ── MapStruct ─────────────────────────────────────────
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // ── Swagger ───────────────────────────────────────────
    //implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // ── Rate Limiting ─────────────────────────────────────
   // implementation 'io.github.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    // ── Utils ─────────────────────────────────────────────
    // jasypt: 미사용(ENC() 값 없음) + Spring Boot 4 Flyway 순환 의존성 유발하여 제거
    // implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

    // ── CSV ───────────────────────────────────────────────
    // 상품 csv 일괄 등록 파싱
    implementation 'com.opencsv:opencsv:5.9'

    // ─── OAuth2 ───────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'

    // ── DevTools ──────────────────────────────────────────
    developmentOnly 'org.springframework.boot:spring-boot-devtools'


    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ── Firebase Admin SDK (FCM 푸시 알림) ───────────────────
    implementation 'com.google.firebase:firebase-admin:9.2.0'
    // ── Test ──────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.8.0'
    testImplementation 'org.assertj:assertj-core:3.25.1'

    // ── Testcontainers ────────────────────────────────────
    // 동시성 테스트는 실제 MySQL 의 비관적 락(SELECT ... FOR UPDATE) 동작이 필요하므로
    // H2 가 아닌 컨테이너 MySQL 을 띄운다. (Docker 필요)
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'

    // @EmbeddedKafka — 브로커를 인메모리로 띄워 발행·수신을 검증한다
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testCompileOnly    'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    // ── Testcontainers 용 Docker 접속 설정 ────────────────────────────
    // Windows 의 Docker Desktop 은 desktop-linux 컨텍스트(named pipe)를 쓰는데
    // Testcontainers 가 이를 자동 탐지하지 못해 "Could not find a valid Docker environment" 로 죽는다.
    // Linux/CI 에서는 기본 소켓 탐지를 그대로 쓰도록 Windows 에서만 지정한다.
    if (System.getProperty('os.name').toLowerCase().contains('windows')
            && System.getenv('DOCKER_HOST') == null) {
        environment 'DOCKER_HOST', 'npipe:////./pipe/docker_engine'
    }
    // Docker Engine 29 부터 API 1.44 미만 요청을 400 으로 거부한다.
    // docker-java 의 기본 API 버전이 더 낮아 명시적으로 올려준다.
    // (env DOCKER_API_VERSION 이 아니라 시스템 프로퍼티 api.version 을 읽는다)
    systemProperty 'api.version', '1.44'
}
